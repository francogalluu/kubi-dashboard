<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KUBI</title>
  <meta name="description" content="Todo lo que guardaste en KUBI: notas, tareas y check-ins" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="login-screen">
    <form id="login-form" class="login-card">
      <h1>KUBI</h1>
      <p class="sub">Tus notas, tareas y check-ins</p>
      <input id="email" type="email" placeholder="Email" autocomplete="username" required />
      <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required />
      <button id="login-button" class="primary" type="submit">Entrar</button>
      <button id="forgot-button" class="ghost" type="button">¿Olvidaste tu contraseña?</button>
      <div id="login-error"></div>
    </form>
  </div>

  <div id="recovery-screen" class="hidden">
    <form id="recovery-form" class="login-card">
      <h1>Nueva contraseña</h1>
      <p class="sub">Elegí una contraseña para tu cuenta</p>
      <input id="new-password" type="password" placeholder="Contraseña nueva" autocomplete="new-password" minlength="8" required />
      <button id="recovery-button" class="primary" type="submit">Guardar</button>
      <div id="recovery-error"></div>
    </form>
  </div>

  <div id="app" class="hidden">
    <header class="top">
      <div>
        <p class="eyebrow">Hola</p>
        <h1>Tu segundo cerebro</h1>
      </div>
      <button id="logout-button" class="icon-button" aria-label="Salir" title="Salir">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </header>

    <section id="panel-notes"></section>
    <section id="panel-tasks" class="hidden"></section>
    <section id="panel-expenses" class="hidden"></section>
    <section id="panel-checkins" class="hidden"></section>

    <nav class="tabs">
      <button class="active" data-tab="notes">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg></span>
        <span class="tab-label">Notas</span>
      </button>
      <button data-tab="tasks">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>
        <span class="tab-label">Tareas</span>
      </button>
      <button data-tab="expenses">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg></span>
        <span class="tab-label">Gastos</span>
      </button>
      <button data-tab="checkins">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></span>
        <span class="tab-label">Check-ins</span>
      </button>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
